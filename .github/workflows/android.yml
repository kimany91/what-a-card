name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm ci

      - name: Test du moteur (parties bot contre bot)
        run: node scripts/sim.mjs 10

      - name: Build web
        run: npm run build

      - name: Synchro Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "what-a-card-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: what-a-card-v${{ env.VERSION }}
          path: what-a-card-v${{ env.VERSION }}.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: What a Card v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: what-a-card-v${{ env.VERSION }}.apk
          body: |
            APK Android de What a Card v${{ env.VERSION }}.
            Télécharge le fichier .apk depuis ton téléphone, puis ouvre-le pour l'installer
            (Android te demandera d'autoriser l'installation d'applications inconnues).
